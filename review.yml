aid: storable
name: Storable
review:
  question: Does Storable expose a documented public WebSocket API?
  answer: false
  date: '2026-07-03'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Storable's storEDGE v1 API reference
    documents a pure request/response REST surface over HTTPS with no
    server-push transport (WebSocket or SSE) to model. Gate hardware and
    third-party listing/marketing integrations receive updates either by
    polling storEDGE endpoints or by the third party being POSTed to as a
    configured recipient (e.g. gate activity logging is inbound POST from
    hardware to Storable, not a Storable-initiated push to integrators), which
    is not a documented public streaming contract worth modeling as AsyncAPI.
findings:
  summary: |
    Storable does not publish a documented public WebSocket API on either of
    its two API surfaces. Storable is a brand family (SiteLink, storEDGE,
    SpareFoot) built through acquisition, and the two property-management
    products expose two different, non-unified APIs:

    1. storEDGE REST API (api.storedgefms.com) - a modern, genuinely publicly
       documented REST API at https://api.storedgefms.com/docs/v1.html. Anyone
       can read the full endpoint reference without an NDA; calling it requires
       being a storEDGE customer and generating a facility-scoped API access
       key/secret, used for one-legged OAuth 1.0 signing (no WebSocket, no SSE -
       plain request/response HTTPS with JSON bodies and page/per_page
       pagination).
    2. SiteLink legacy API - an older SOAP-style API whose reference document
       is a password-protected PDF at apidoc.sitelink.com, released only after
       signing an NDA, plus a separate API license application at
       apilicenseapplication.sitelink.com. No endpoint list is publicly
       readable; SiteLink documents four access levels (API Aggregator,
       API Regular/Transaction, API Full Reporting, API Insurance Reporting).

    This entry models the storEDGE surface, since its endpoint reference is
    genuinely public, and treats SiteLink as a gated legacy sibling rather than
    fabricating its endpoint list.
  brandFamily: |
    Storable Inc. is the parent brand. storEDGE and SiteLink are both
    property-management products it owns and continues to sell in parallel
    (competing directly with each other in Storable's own product comparison
    pages), and SpareFoot is Storable's storage-unit listing marketplace that
    both products' partner integrations feed. Marketplace/technology partners
    (call centers, gate vendors, insurance, listing sites like SpareFoot and
    StorageTreasures) integrate against whichever of the two management-system
    APIs a given facility runs.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.storedgefms.com/v1
      documented: true
      note: storEDGE v1 API. Publicly readable reference; one-legged OAuth 1.0 required to call.
    - protocol: SOAP
      scheme: https
      documented: false
      note: SiteLink legacy API. Reference document exists but is NDA-gated (password-protected PDF); not publicly readable.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented for either storEDGE or SiteLink as of the review date.
  endpointsConfirmedRest:
