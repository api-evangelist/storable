  endpointsModeled: false
  endpointsModeledNote: |
    The endpoint paths above and in apis.yml/openapi are confirmed from
    Storable's own public v1 API reference page, not fabricated. What is
    modeled (and explicitly not confirmed) is the field-level JSON schema for
    request/response bodies in openapi/storable-openapi.yml, since the source
    documentation page enumerates endpoints and parameters but was not
    captured with full per-field response schemas during this review.
sources:
  - url: https://api.storedgefms.com/docs/v1.html
    type: APIReference
    note: Public storEDGE v1 endpoint reference - one-legged OAuth 1.0, JSON, page/per_page pagination, meta-hash error format. No WebSocket or webhook mechanism documented.
  - url: https://www.sitelink.com/solutions/integrations-partners
    type: Documentation
    note: Describes SiteLink's API-integrated partner program and marketplace; no endpoint detail disclosed publicly.
  - url: https://support.sitelink.com/hc/en-us/articles/30254231063319-How-to-create-a-corporate-API-user-account
    type: Documentation
    note: Confirms SiteLink API access levels (Aggregator, Regular, Full Reporting, Insurance Reporting) and NDA/license-application gating.
  - url: https://www.storable.com/products/software-integrations/
    type: Documentation
    note: Storable-level integrations marketing page covering SiteLink, storEDGE, and SpareFoot partner categories.
  - url: https://tray.ai/documentation/connectors/service/storedge
    type: Documentation
    note: Third-party iPaaS connector confirming storEDGE base URL, OAuth 1.0 credential model, and link to the official v1 doc.
  - url: https://github.com/madurapa/sitelink-php
    type: SourceCode
    note: Community PHP wrapper referencing legacy SiteLink SOAP methods (GetFacilities, GetSiteInformation, GetUnits, GetUnitInformation) and confirming the apidoc.sitelink.com NDA gate.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists on either of Storable's two APIs, and
    storEDGE (the surface modeled in this entry) is a pure request/response
    REST API. No AsyncAPI document was created because there is no
    server-push transport to model; SiteLink's parallel legacy API could not
    be assessed for transport beyond "SOAP over HTTPS" since its reference is
    NDA-gated.
