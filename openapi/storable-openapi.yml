components:
  securitySchemes:
    oauth1:
      type: http
      scheme: oauth1
      description: >-
        Non-standard OpenAPI representation of storEDGE's actual scheme:
        one-legged OAuth 1.0. The API access key issued to a storEDGE customer
        is used as the OAuth consumer key and the API secret key as the
        consumer secret, signing each request; there is no three-legged
        redirect/token exchange.
  parameters:
    facilityId:
      name: facility_id
      in: path
      required: true
      description: The storEDGE facility ID the request is scoped to.
      schema:
        type: string
    companyId:
      name: company_id
      in: path
      required: true
      description: The storEDGE company (multi-facility account) ID.
      schema:
        type: string
    tenantId:
      name: tenant_id
      in: path
      required: true
      schema:
        type: string
    page:
      name: page
      in: query
      description: Page number for paginated collection endpoints.
      schema:
        type: integer
        default: 1
    perPage:
      name: per_page
      in: query
      description: Items per page for paginated collection endpoints (default 100).
      schema:
        type: integer
        default: 100
  responses:
    Unauthorized:
      description: Missing or invalid OAuth 1.0 signature/credentials.
    NotFound:
      description: Resource not found.
  schemas:
    Meta:
      type: object
      description: >-
        Every storEDGE response body includes a meta hash with request
        parameters, method, pagination, and status/error details.
      properties:
        status_code:
          type: integer
        status_message:
          type: string
        error_code:
          type: integer
          nullable: true
        request_id:
          type: string
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer
    Tenant:
      type: object
      properties:
        id:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        phone:
          type: string
        status:
          type: string
          enum: [current, previous]
        facility_id:
          type: string
    TenantInput:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        phone:
          type: string
    TenantPreferences:
      type: object
      properties:
        email_opt_in:
          type: boolean
        sms_opt_in:
          type: boolean
        autopay_reminders:
          type: boolean
    Unit:
      type: object
      properties:
        id:
          type: string
        unit_number:
          type: string
        unit_group_id:
          type: string
        unit_type_id:
          type: string
        width:
          type: number
        length:
          type: number
        standard_rate:
          type: number
        web_rate:
          type: number
        status:
          type: string
          enum: [available, rented, unrentable]
    UnitInput:
      type: object
      properties:
        unit_number:
          type: string
        unit_group_id:
          type: string
        unit_type_id:
          type: string
        width:
          type: number
        length:
          type: number
        standard_rate:
          type: number
    UnitGroup:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        max_rate:
          type: number
    Ledger:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        unit_id:
          type: string
        balance:
          type: number
        next_due_date:
          type: string
          format: date
        autopay_enabled:
          type: boolean
        delinquent:
          type: boolean
    PaymentInput:
      type: object
      properties:
        payment_method_id:
          type: string
        amount:
          type: number
    PaymentMethodInput:
      type: object
      properties:
        type:
          type: string
          enum: [credit_card, ach, digital_wallet]
        token:
          type: string
    Lead:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [inquiry, reservation, waitlist, missed_move_in, current]
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        phone:
          type: string
        unit_group_id:
          type: string
        source:
          type: string
    LeadInput:
      type: object
      properties:
        status:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        phone:
          type: string
        unit_group_id:
          type: string
        source:
          type: string
    MoveInInput:
      type: object
      properties:
        lead_id:
          type: string
        unit_id:
          type: string
        move_in_date:
          type: string
          format: date
        payment_method_id:
          type: string
    TaskInput:
      type: object
      properties:
        category:
          type: string
        description:
          type: string
        due_date:
          type: string
          format: date
    DelinquencyEvent:
      type: object
      properties:
        id:
          type: string
        ledger_id:
          type: string
        tenant_id:
          type: string
        stage:
          type: string
        days_delinquent:
          type: integer
        balance:
          type: number
    Auction:
      type: object
      properties:
        id:
          type: string
        unit_id:
          type: string
        facility_id:
          type: string
        scheduled_date:
          type: string
          format: date
        status:
          type: string
          enum: [scheduled, active, completed, canceled]
    ReportRequestInput:
      type: object
      properties:
        report_type:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
    ReportRequest:
      type: object
      properties:
        id:
          type: string
        report_type:
          type: string
        status:
          type: string
          enum: [pending, processing, completed, failed]
        created_at:
          type: string
          format: date-time
