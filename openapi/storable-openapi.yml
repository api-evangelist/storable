  /{facility_id}/ledgers/{ledger_id}/make_payment:
    post:
      operationId: makeLedgerPayment
      tags: [Ledgers & Payments]
      summary: Make a payment against a ledger
      parameters:
        - $ref: '#/components/parameters/facilityId'
        - name: ledger_id
          in: path
          required: true
