description: >-
  FinOps view of Storable spend. Storable's cost surface is the underlying
  storEDGE or SiteLink software subscription (per-facility, per-feature,
  billed monthly) rather than a separate API meter - once a facility
  subscribes, its storEDGE REST API access (or SiteLink's NDA-gated SOAP API)
  is included. The real cost drivers are facility count, unit count, and which
  feature modules (payments, insurance, gate access, business intelligence,
  eSign) are enabled per facility, plus payment-processing fees on tenant
  transactions run through Storable's payments stack.
notes: >-
  No public per-call or per-request API billing model exists to reconcile.
  Verify current subscription tiers, feature add-on pricing, and payment
  processing rates directly with Storable sales.
sources:
- https://www.storable.com/products/edge/
