alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Storable
serviceCategory: Vertical SaaS - Property Management
billingModel:
  pricingCategory: Fixed (per-facility, per-feature subscription)
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Purchase
  - Usage
  - Adjustment
focusColumns:
  ServiceName: storEDGE / SiteLink
  ServiceCategory: Vertical SaaS - Property Management
  ProviderName: Storable
  PublisherName: Storable
  InvoiceIssuerName: Storable
  BillingCurrency: USD
  ChargeCategory: Purchase
  PricingCategory: Fixed
meters:
- name: facility_subscription
  description: Monthly per-facility, per-feature software subscription fee (storEDGE or SiteLink).
  unit: facilities
  aggregation: sum
  dimensions:
  - facility
  - feature_module
- name: payment_processing
  description: Fees on tenant rent, fee, and retail payments processed through Storable Payments and surfaced via the ledgers/payments endpoints.
  unit: transactions
  aggregation: sum
  dimensions:
  - facility
  - tenant
- name: insurance_program_revenue_share
  description: Revenue share or program fees tied to tenant protection/insurance enrollment surfaced via the insurance endpoints.
  unit: enrollments
  aggregation: sum
  dimensions:
  - facility
- name: api_integration_effort
  description: Internal engineering cost to build and maintain a storEDGE API integration or to obtain and maintain a SiteLink API NDA/license (no direct Storable invoice line, but a real cost).
  unit: hours
  aggregation: sum
  dimensions:
  - integration
principles:
- name: Visibility
  description: Track per-facility subscription cost against enabled feature modules; reconcile payment-processing and insurance revenue-share fees against ledger and insurance endpoint activity.
- name: Allocation
  description: Attribute subscription and processing costs to the specific facility (facility_id) or company (company_id) they were incurred under, matching Storable's own API scoping.
- name: Optimization
  description: Right-size which feature modules are enabled per facility; consolidate multi-facility operators onto company-level reporting/report_requests endpoints instead of per-facility polling to reduce integration overhead.
- name: Accountability
  description: Assign an owner for the SiteLink NDA/API-license relationship (legal + engineering) separately from the storEDGE technical integration owner, since the two APIs have different authorization paths.
